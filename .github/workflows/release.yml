name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Verifica ref, tag, commit e versione
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::La release può essere eseguita soltanto da un ref tag, anche con workflow_dispatch."
            exit 1
          fi

          tag="$GITHUB_REF_NAME"
          tag_ref="refs/tags/$tag"
          git show-ref --verify --quiet "$tag_ref"
          tag_commit=$(git rev-parse "$tag_ref^{commit}")
          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          checkout_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$event_commit" ] || [ "$tag_commit" != "$checkout_commit" ]; then
            echo "::error::Il tag $tag, GITHUB_SHA e il checkout non risolvono allo stesso commit."
            exit 1
          fi

          skill_version=$(python -c 'import re; from pathlib import Path; text=Path("SKILL.md").read_text(encoding="utf-8"); match=re.search(r"^Versione: \*\*([^*]+)\*\*$", text, re.MULTILINE); assert match, "Versione skill mancante"; print(match.group(1))')
          plugin_skill_version=$(python -c 'import re; from pathlib import Path; text=Path("agent-plugin/skills/carousel-builder/SKILL.md").read_text(encoding="utf-8"); match=re.search(r"^Versione: \*\*([^*]+)\*\*$", text, re.MULTILINE); assert match, "Versione skill plugin mancante"; print(match.group(1))')
          plugin_version=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("agent-plugin/plugin.json").read_text(encoding="utf-8"))["version"])')
          ci_package_version=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("package.json").read_text(encoding="utf-8"))["version"])')
          editor_version=$(python -c 'import re; from pathlib import Path; text=Path("scripts/review_server.py").read_text(encoding="utf-8"); match=re.search(r"^EDITOR_VERSION = \"([^\"]+)\"$", text, re.MULTILINE); assert match, "EDITOR_VERSION root mancante"; print(match.group(1))')
          plugin_editor_version=$(python -c 'import re; from pathlib import Path; text=Path("agent-plugin/skills/carousel-builder/scripts/review_server.py").read_text(encoding="utf-8"); match=re.search(r"^EDITOR_VERSION = \"([^\"]+)\"$", text, re.MULTILINE); assert match, "EDITOR_VERSION plugin mancante"; print(match.group(1))')
          echo "SKILL.md=$skill_version plugin-SKILL.md=$plugin_skill_version plugin.json=$plugin_version package.json=$ci_package_version root-editor=$editor_version plugin-editor=$plugin_editor_version tag=$tag commit=$tag_commit"
          test "$skill_version" = "$plugin_skill_version"
          test "$skill_version" = "$plugin_version"
          test "$skill_version" = "$ci_package_version"
          test "$skill_version" = "$editor_version"
          test "$skill_version" = "$plugin_editor_version"
          test "${tag#v}" = "$skill_version"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Esegui controlli e suite completa
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -B -m unittest discover -s tests -t tests -v
          python -B tests/quick_validate.py .
          python -B tests/quick_validate.py agent-plugin/skills/carousel-builder
          node --check scripts/export_review_pdf.cjs
          node --check assets/review-editor/app.js
          node --check agent-plugin/skills/carousel-builder/scripts/export_review_pdf.cjs
          node --check agent-plugin/skills/carousel-builder/assets/review-editor/app.js
          node --test tests/test_export_review_pdf.cjs
          test -x /usr/bin/google-chrome
          PYTHON=python CHROME_PATH=/usr/bin/google-chrome node --test tests/test_browser_smoke.cjs

      - name: Esegui export reale con dipendenze bloccate
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHON: python
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high
          node --test tests/test_export_review_pdf_e2e.cjs

      - name: Verifica il mirror Agent Plugin
        shell: bash
        run: |
          set -euo pipefail
          for shared_path in SKILL.md references scripts assets agents; do
            diff -r -x __pycache__ "$shared_path" "agent-plugin/skills/carousel-builder/$shared_path"
          done
          cmp LICENSE agent-plugin/LICENSE

      - name: Costruisci i pacchetti da allowlist
        shell: bash
        run: |
          set -euo pipefail
          root_stage="$RUNNER_TEMP/package-root/carousel-builder"
          plugin_stage="$RUNNER_TEMP/package-plugin"
          install -d "$root_stage" "$plugin_stage" dist

          for package_path in SKILL.md README.md LICENSE agents assets references scripts; do
            cp -R "$package_path" "$root_stage/"
          done
          for package_path in plugin.json README.md LICENSE skills; do
            cp -R "agent-plugin/$package_path" "$plugin_stage/"
          done

          find "$root_stage" "$plugin_stage" -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete
          find "$root_stage" "$plugin_stage" -type d -name '__pycache__' -empty -delete
          # Normalize every ZIP timestamp to the tagged commit so a safe draft
          # resume rebuilds byte-identical packages on a fresh runner.
          source_date_epoch=$(git show -s --format=%ct HEAD)
          find "$root_stage" "$plugin_stage" -exec touch -h -d "@$source_date_epoch" {} +
          (cd "$(dirname "$root_stage")" && zip -X -qr "$GITHUB_WORKSPACE/dist/carousel-builder.zip" carousel-builder)
          (cd "$plugin_stage" && zip -X -qr "$GITHUB_WORKSPACE/dist/carousel-builder-agent-plugin.zip" .)

      - name: Verifica integrità e contenuto dei due ZIP
        shell: bash
        run: |
          set -euo pipefail
          root_stage="$RUNNER_TEMP/package-root/carousel-builder"
          plugin_stage="$RUNNER_TEMP/package-plugin"
          root_extract="$RUNNER_TEMP/extracted-root"
          plugin_extract="$RUNNER_TEMP/extracted-plugin"
          install -d "$root_extract" "$plugin_extract"

          unzip -t dist/carousel-builder.zip
          unzip -t dist/carousel-builder-agent-plugin.zip
          unzip -q dist/carousel-builder.zip -d "$root_extract"
          unzip -q dist/carousel-builder-agent-plugin.zip -d "$plugin_extract"

          diff -r "$root_stage" "$root_extract/carousel-builder"
          diff -r "$plugin_stage" "$plugin_extract"
          python -B tests/quick_validate.py "$root_extract/carousel-builder"
          python -B tests/quick_validate.py "$plugin_extract/skills/carousel-builder"
          for shared_path in SKILL.md references scripts assets agents; do
            diff -r -x __pycache__ \
              "$root_extract/carousel-builder/$shared_path" \
              "$plugin_extract/skills/carousel-builder/$shared_path"
          done

      - name: Genera checksum pubblici
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum \
            carousel-builder.zip \
            carousel-builder-agent-plugin.zip \
            > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Crea o riprende e verifica una release draft senza sovrascritture
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_COMMIT: ${{ steps.version.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets="SHA256SUMS,carousel-builder-agent-plugin.zip,carousel-builder.zip"
          expected_asset_names=(
            SHA256SUMS
            carousel-builder-agent-plugin.zip
            carousel-builder.zip
          )
          load_matching_release_ids() {
            mapfile -t matching_release_ids < <(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          }
          matching_release_ids=()
          load_matching_release_ids
          if [ "${#matching_release_ids[@]}" -gt 1 ]; then
            echo "::error::Più release condividono il tag $TAG; pubblicazione interrotta."
            exit 1
          fi
          if [ "${#matching_release_ids[@]}" -eq 1 ]; then
            release_id="${matching_release_ids[0]}"
            resume_draft=true
          else
            gh release create "$TAG" \
              --verify-tag \
              --target "$TAG_COMMIT" \
              --title "Carousel Builder ${TAG#v}" \
              --generate-notes \
              --draft \
              dist/carousel-builder.zip \
              dist/carousel-builder-agent-plugin.zip \
              dist/SHA256SUMS
            # La lista release può essere eventualmente consistente subito
            # dopo la creazione. Attendi l'ID senza creare una seconda draft.
            for attempt in {1..10}; do
              load_matching_release_ids
              if [ "${#matching_release_ids[@]}" -gt 1 ]; then
                echo "::error::Più release condividono il tag $TAG; pubblicazione interrotta."
                exit 1
              fi
              if [ "${#matching_release_ids[@]}" -eq 1 ]; then
                break
              fi
              if [ "$attempt" -lt 10 ]; then
                sleep 2
              fi
            done
            if [ "${#matching_release_ids[@]}" -ne 1 ]; then
              echo "::error::La draft $TAG appena creata non è risolvibile in modo univoco."
              exit 1
            fi
            release_id="${matching_release_ids[0]}"
            resume_draft=false
          fi

          download_dir="$RUNNER_TEMP/release-download"
          install -d "$download_dir"
          release_json=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id")
          test -n "$release_json"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          if [ "$(jq -r '.draft' <<<"$release_json")" != "true" ]; then
            echo "::error::La release pubblica $TAG esiste già: gli asset non vengono sovrascritti."
            exit 1
          fi
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$TAG_COMMIT"

          # Una gh release create interrotta può lasciare una draft con un
          # sottoinsieme degli asset. Accetta soltanto nomi previsti, univoci,
          # uploaded e byte-identici al pacchetto appena ricostruito; solo in
          # quel caso completa i mancanti senza mai sovrascrivere.
          declare -A verified_assets=()
          while IFS=$'\t' read -r asset_id asset_name asset_state asset_size; do
            case ",$expected_assets," in
              *",$asset_name,"*) ;;
              *)
                echo "::error::La draft contiene un asset inatteso: $asset_name"
                exit 1
                ;;
            esac
            if [ -n "${verified_assets[$asset_name]+present}" ]; then
              echo "::error::La draft contiene due asset chiamati $asset_name."
              exit 1
            fi
            test "$asset_state" = "uploaded"
            test "$asset_size" -gt 0
            gh api \
              -H "Accept: application/octet-stream" \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$download_dir/$asset_name"
            cmp "dist/$asset_name" "$download_dir/$asset_name"
            verified_assets["$asset_name"]=1
          done < <(jq -r '.assets[] | [.id, .name, .state, .size] | @tsv' <<<"$release_json")

          if [ "$resume_draft" = "true" ]; then
            echo "Riprendo la release draft $TAG dopo aver verificato ogni asset presente."
            for asset_name in "${expected_asset_names[@]}"; do
              if [ -z "${verified_assets[$asset_name]+present}" ]; then
                gh release upload "$TAG" "dist/$asset_name"
              fi
            done
          fi

          release_json=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/releases/$release_id")
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$TAG_COMMIT"
          test "$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release_json")" = "$expected_assets"
          test "$(jq -r 'all(.assets[]; .state == "uploaded" and .size > 0)' <<<"$release_json")" = "true"
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api \
              -H "Accept: application/octet-stream" \
              "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$download_dir/$asset_name"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<<"$release_json")
          cmp dist/SHA256SUMS "$download_dir/SHA256SUMS"
          (cd "$download_dir" && sha256sum --check SHA256SUMS)
          unzip -t "$download_dir/carousel-builder.zip"
          unzip -t "$download_dir/carousel-builder-agent-plugin.zip"

      - name: Pubblica la release verificata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          release_json=$(gh release view "$TAG" --json isDraft,isPrerelease,assets,url)
          test "$(jq -r '.isDraft' <<<"$release_json")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.assets | length' <<<"$release_json")" = "3"
          jq -r '.url' <<<"$release_json"
