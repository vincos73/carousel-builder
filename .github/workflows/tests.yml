name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/carousel-builder-pycache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: python -B -m unittest discover -s tests -t tests -v

  windows-unittest:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}\carousel-builder-pycache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: python -B -m unittest discover -s tests -t tests -v

  node-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check scripts/export_review_pdf.cjs
          node --check assets/review-editor/app.js
      - name: Run exporter regression tests
        run: node --test tests/test_export_review_pdf.cjs

  package-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Valida skill root e skill nel pacchetto Agent Plugin
        run: |
          python -B tests/quick_validate.py .
          python -B tests/quick_validate.py agent-plugin/skills/carousel-builder
      - name: Il pacchetto Agent Plugins deve restare identico alla skill
        run: |
          for shared_path in SKILL.md references scripts assets agents; do
            diff -r -x __pycache__ "$shared_path" "agent-plugin/skills/carousel-builder/$shared_path"
          done
      - name: La versione della skill deve coincidere con quella del plugin
        run: |
          skill_version=$(grep -oP '(?<=^Versione: \*\*)[^*]+' SKILL.md)
          plugin_version=$(python -c "import json;print(json.load(open('agent-plugin/plugin.json'))['version'])")
          echo "SKILL.md=$skill_version plugin.json=$plugin_version"
          test "$skill_version" = "$plugin_version"
      - name: La licenza MIT deve essere inclusa nel pacchetto Agent Plugin
        run: cmp LICENSE agent-plugin/LICENSE
